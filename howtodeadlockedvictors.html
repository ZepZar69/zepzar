<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How To Deadlocked Victors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Lexend Deca", sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url(howtodeadlocked.png);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .victor-card {
            width: min(550px, 100%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgb(50, 50, 50);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .back-link {
            color: rgb(75, 189, 255);
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .title {
            font-size: 36px;
            margin: 0 0 20px 0;
            border-bottom: 2px solid rgb(50, 50, 50);
            padding-bottom: 10px;
        }

        .victors-list {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .victorstext {
            margin: 0;
            color: #a5a5a5;
            font-style: italic;
        }

        .total-count {
            margin: 0;
            font-size: 16px;
            color: #7c7c7c;
        }
    </style>
</head>
<body>  

    <div class="victor-card">
        <a href="gagolist.html" class="back-link">← Back to List</a>
        <h1 class="title">How To Deadlocked Victors</h1>
        <div class="victors-list">
            <h3 class="victorstext">None</h3>
        </div>
        <h4 class="total-count">Total Victors: 0</h4>
    </div>

</body>
</html>
