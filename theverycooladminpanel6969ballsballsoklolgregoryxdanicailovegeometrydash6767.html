<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gago List Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #173a63 0%, #101522 30%, #0b0b0b 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 40px 20px;
            font-family: "Lexend Deca", sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .admin-container {
            width: min(650px, 100%);
            background: rgba(24, 24, 24, 0.75);
            border: 1px solid rgb(38, 38, 38);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            margin-top: 20px;
        }

        h1, h2 {
            margin-top: 0;
            background: linear-gradient(90deg, #4bbdff, #8b7cff, #ff5ca8);
            -webkit-background-clip: text;
            color: transparent;
        }

        h2 {
            font-size: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-top: 10px;
        }

        .back-link {
            color: rgb(75, 189, 255);
            text-decoration: none;
            align-self: flex-start;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        label {
            font-size: 13px;
            color: #a5a5a5;
            font-weight: 600;
        }

        input, select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #4bbdff;
        }

        .btn-submit {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #ff6b81;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            background: #2ed573;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            display: none;
            box-shadow: 0 10px 20px rgba(46, 213, 115, 0.3);
            z-index: 99;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a5a5a5;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .tab-btn.active {
            background: rgba(75, 189, 255, 0.1);
            border-color: #4bbdff;
            color: #4bbdff;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        /* Manage list styling */
        .manage-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .manage-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .manage-item .level-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .manage-item .level-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .manage-item select {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
        }

        .action-btns {
            display: flex;
            gap: 4px;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-danger {
            background: rgba(255, 71, 87, 0.2);
            border-color: #ff4757;
            color: #ff4757;
        }

        .btn-danger:hover {
            background: #ff4757;
            color: white;
        }
    </style>
</head>
<body>

    <a href="gagolist.html" class="back-link">← Return to List</a>
    
    <div class="admin-container">
        <h1>Gago Admin Control</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('level-form')">Add Level</button>
            <button class="tab-btn" onclick="switchTab('manage-form')">Manage / Reorder</button>
            <button class="tab-btn" onclick="switchTab('victor-form')">Add Victor</button>
        </div>

        <form id="level-form" class="form-section active">
            <h2>Add New Level Card</h2>
            <div class="form-group">
                <label>List Rank (e.g. 1, 2, 3...)</label>
                <input type="number" id="levelRank" required placeholder="1">
            </div>
            <div class="form-group">
                <label>Level Name</label>
                <input type="text" id="levelName" required placeholder="Last stop">
            </div>
            <div class="form-group">
                <label>Creator Name</label>
                <input type="text" id="levelCreator" required placeholder="Jevan">
            </div>
            <div class="form-group">
                <label>Level ID</label>
                <input type="text" id="levelId" required placeholder="143608276">
            </div>
            <div class="form-group">
                <label>Difficulty Estimation</label>
                <select id="levelDifficulty">
                    <option value="Easy Demon">Easy Demon</option>
                    <option value="Medium Demon">Medium Demon</option>
                    <option value="Hard Demon">Hard Demon</option>
                    <option value="Insane Demon">Insane Demon</option>
                    <option value="Extreme Demon">Extreme Demon</option>
                </select>
            </div>
            <div class="form-group">
                <label>Thumbnail Image URL/Path (e.g. laststop.jpeg)</label>
                <input type="text" id="levelThumb" required placeholder="laststop.jpeg">
            </div>
            <div class="form-group">
                <label>Video URL</label>
                <input type="url" id="levelVideo" required placeholder="https://youtu.be/...">
            </div>
            <div class="form-group">
                <label>Video Action Type</label>
                <select id="levelVideoType">
                    <option value="Verification">Verification</option>
                    <option value="Showcase">Showcase</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Publish to Firebase</button>
        </form>

        <div id="manage-form" class="form-section">
            <h2>Manage & Reorder Levels</h2>
            <div id="manage-level-list" class="manage-list">
                <p style="color: #a5a5a5;">Loading levels...</p>
            </div>
            <button type="button" id="save-order-btn" class="btn-submit" style="margin-top: 15px;">Save Hierarchy & Difficulty Changes</button>
        </div>

        <form id="victor-form" class="form-section">
            <h2>Add Player Victor</h2>
            <div class="form-group">
                <label>Select Level</label>
                <select id="victorLevelSelect" required>
                    <option value="">Loading active levels...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Player Username</label>
                <input type="text" id="victorName" required placeholder="GamerName">
            </div>
            <div class="form-group">
                <label>Proof Video Link</label>
                <input type="url" id="victorProof" required placeholder="https://youtu.be/...">
            </div>
            <button type="submit" class="btn-submit">Register Victor</button>
        </form>
    </div>

    <div id="toast" class="toast">Data successfully pushed!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABhdmEpVDR4jT1SSx85Y9Kglx9iiLPyaw",
            authDomain: "gago-list.firebaseapp.com",
            projectId: "gago-list",
            storageBucket: "gago-list.firebasestorage.app",
            messagingSenderId: "810290637749",
            appId: "1:810290637749:web:0e286faeee533032c247fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let loadedLevels = [];

        // --- ADD LEVEL ---
        document.getElementById('level-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const levelData = {
                rank: parseInt(document.getElementById('levelRank').value),
                name: document.getElementById('levelName').value,
                creator: document.getElementById('levelCreator').value,
                levelId: document.getElementById('levelId').value,
                difficulty: document.getElementById('levelDifficulty').value,
                thumbnailUrl: document.getElementById('levelThumb').value,
                videoUrl: document.getElementById('levelVideo').value,
                videoType: document.getElementById('levelVideoType').value,
                createdAt: new Date()
            };

            try {
                await addDoc(collection(db, "levels"), levelData);
                showToast("Level uploaded to Firebase!");
                document.getElementById('level-form').reset();
                loadLevelDropdown();
            } catch (error) {
                console.error("Error writing level document: ", error);
                alert("Upload failed: " + error.message);
            }
        });

        // --- ADD VICTOR ---
        document.getElementById('victor-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const victorData = {
                levelId: document.getElementById('victorLevelSelect').value,
                playerName: document.getElementById('victorName').value,
                proofUrl: document.getElementById('victorProof').value,
                createdAt: new Date()
            };

            try {
                await addDoc(collection(db, "victors"), victorData);
                showToast("Victor recorded successfully!");
                document.getElementById('victor-form').reset();
            } catch (error) {
                console.error("Error writing victor document: ", error);
                alert("Upload failed: " + error.message);
            }
        });

        // --- FETCH LEVELS FOR SELECT DROPDOWN ---
        async function loadLevelDropdown() {
            const selectEl = document.getElementById("victorLevelSelect");
            selectEl.innerHTML = '<option value="">-- Choose Level --</option>';
            try {
                const q = query(collection(db, "levels"), orderBy("rank", "asc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const opt = document.createElement("option");
                    opt.value = data.levelId;
                    opt.textContent = `#${data.rank} - ${data.name}`;
                    selectEl.appendChild(opt);
                });
            } catch (e) {
                console.error("Error loading dropdown: ", e);
            }
        }

        // --- FETCH AND RENDER MANAGE LIST ---
        async function loadManageList() {
            const container = document.getElementById("manage-level-list");
            container.innerHTML = "<p style='color:#a5a5a5;'>Loading levels...</p>";
            try {
                const q = query(collection(db, "levels"), orderBy("rank", "asc"));
                const querySnapshot = await getDocs(q);
                loadedLevels = [];
                querySnapshot.forEach((docSnap) => {
                    loadedLevels.push({ docId: docSnap.id, ...docSnap.data() });
                });
                renderManageList();
            } catch (e) {
                console.error("Error loading management list: ", e);
                container.innerHTML = "<p style='color:#ff4757;'>Failed to load levels.</p>";
            }
        }

        function renderManageList() {
            const container = document.getElementById("manage-level-list");
            if (loadedLevels.length === 0) {
                container.innerHTML = "<p style='color:#a5a5a5;'>No levels found.</p>";
                return;
            }

            container.innerHTML = "";
            loadedLevels.forEach((lvl, index) => {
                const item = document.createElement("div");
                item.className = "manage-item";
                item.dataset.docId = lvl.docId;

                item.innerHTML = `
                    <div class="action-btns">
                        <button type="button" class="btn-icon" onclick="moveLevel(${index}, -1)">▲</button>
                        <button type="button" class="btn-icon" onclick="moveLevel(${index}, 1)">▼</button>
                    </div>
                    <div class="level-info">
                        <span class="level-title">#${index + 1} - ${lvl.name}</span>
                    </div>
                    <select class="diff-select">
                        <option value="Easy Demon" ${lvl.difficulty === "Easy Demon" ? "selected" : ""}>Easy Demon</option>
                        <option value="Medium Demon" ${lvl.difficulty === "Medium Demon" ? "selected" : ""}>Medium Demon</option>
                        <option value="Hard Demon" ${lvl.difficulty === "Hard Demon" ? "selected" : ""}>Hard Demon</option>
                        <option value="Insane Demon" ${lvl.difficulty === "Insane Demon" ? "selected" : ""}>Insane Demon</option>
                        <option value="Extreme Demon" ${lvl.difficulty === "Extreme Demon" ? "selected" : ""}>Extreme Demon</option>
                    </select>
                    <button type="button" class="btn-icon btn-danger" onclick="deleteLevel('${lvl.docId}')">✕</button>
                `;
                container.appendChild(item);
            });
        }

        // Move level up/down in array
        window.moveLevel = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= loadedLevels.length) return;

            // Save current difficulty selection before array manipulation
            const selects = document.querySelectorAll(".diff-select");
            selects.forEach((sel, i) => {
                loadedLevels[i].difficulty = sel.value;
            });

            const temp = loadedLevels[index];
            loadedLevels[index] = loadedLevels[newIndex];
            loadedLevels[newIndex] = temp;

            renderManageList();
        };

        // Delete level document
        window.deleteLevel = async function(docId) {
            if (!confirm("Are you sure you want to delete this level?")) return;
            try {
                await deleteDoc(doc(db, "levels", docId));
                showToast("Level deleted!");
                loadManageList();
                loadLevelDropdown();
            } catch (e) {
                console.error("Error deleting level:", e);
                alert("Delete failed: " + e.message);
            }
        };

        // --- BATCH SAVE RANKS AND DIFFICULTIES ---
        document.getElementById("save-order-btn").addEventListener("click", async () => {
            const items = document.querySelectorAll(".manage-item");
            if (items.length === 0) return;

            const batch = writeBatch(db);

            items.forEach((item, index) => {
                const docId = item.dataset.docId;
                const newRank = index + 1;
                const newDiff = item.querySelector(".diff-select").value;

                const docRef = doc(db, "levels", docId);
                batch.update(docRef, {
                    rank: newRank,
                    difficulty: newDiff
                });
            });

            try {
                await batch.commit();
                showToast("Hierarchy & difficulties updated!");
                loadLevelDropdown();
                loadManageList();
            } catch (e) {
                console.error("Batch update failed:", e);
                alert("Save failed: " + e.message);
            }
        });

        // Tab switching logic
        window.switchTab = function(formId) {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(formId).classList.add('active');
            
            // Highlight current active tab button
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(formId));
            if (activeBtn) activeBtn.classList.add('active');

            if (formId === 'manage-form') {
                loadManageList();
            }
        };

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        loadLevelDropdown();
    </script>
</body>
</html>
