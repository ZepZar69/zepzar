<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch The Kiwi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#1e293b,#0f172a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

.container{
    width:min(900px,100%);
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:24px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

h1{
    font-size:clamp(1.5rem,4vw,2.5rem);
}

.Link1{
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,0.12);
    padding:10px 16px;
    border-radius:12px;
    transition:.2s;
}

.Link1:hover{
    background:rgba(255,255,255,0.2);
}

.stats{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.stat{
    flex:1;
    min-width:120px;
    background:rgba(255,255,255,0.08);
    padding:14px;
    border-radius:14px;
    text-align:center;
}

.game-area{
    position:relative;
    width:100%;
    height:min(65vw,450px);
    min-height:320px;
    background:linear-gradient(180deg,#134e4a,#0f766e);
    border-radius:20px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.1);
}

.kiwi{
    position:absolute;
    font-size:clamp(40px,8vw,65px);
    cursor:pointer;
    user-select:none;
    transition:transform .1s;
}

.kiwi:active{
    transform:scale(0.9);
}

.controls{
    margin-top:20px;
    text-align:center;
}

button{
    border:none;
    padding:14px 26px;
    border-radius:14px;
    font-size:1rem;
    cursor:pointer;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:1.1rem;
    min-height:30px;
}
</style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="header">
            <h1>🥝 Catch The Kiwi</h1>
            <a href="index.html" class="Link1">Go back</a>
        </div>

        <div class="stats">
            <div class="stat">
                <h3>Score</h3>
                <p id="score">0</p>
            </div>

            <div class="stat">
                <h3>Time</h3>
                <p id="time">30</p>
            </div>

            <div class="stat">
                <h3>Best</h3>
                <p id="best">0</p>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="kiwi" id="kiwi">🥝</div>
        </div>

        <div class="controls">
            <button onclick="startGame()">Start Game</button>
        </div>

        <div class="message" id="message">
            Press Start to begin!
        </div>

    </div>
</div>

<script>
const kiwi = document.getElementById("kiwi");
const gameArea = document.getElementById("gameArea");

let score = 0;
let time = 30;
let gameRunning = false;
let timer;

const best = localStorage.getItem("kiwiBest") || 0;
document.getElementById("best").textContent = best;

function moveKiwi(){
    const maxX = gameArea.clientWidth - kiwi.offsetWidth;
    const maxY = gameArea.clientHeight - kiwi.offsetHeight;

    kiwi.style.left = Math.random() * maxX + "px";
    kiwi.style.top = Math.random() * maxY + "px";
}

function startGame(){

    clearInterval(timer);

    score = 0;
    time = 30;
    gameRunning = true;

    document.getElementById("score").textContent = score;
    document.getElementById("time").textContent = time;
    document.getElementById("message").textContent =
        "Catch as many kiwis as possible!";

    moveKiwi();

    timer = setInterval(() => {

        time--;
        document.getElementById("time").textContent = time;

        if(time <= 0){
            endGame();
        }

    },1000);
}

function endGame(){

    gameRunning = false;
    clearInterval(timer);

    let bestScore =
        Number(localStorage.getItem("kiwiBest")) || 0;

    if(score > bestScore){
        bestScore = score;
        localStorage.setItem("kiwiBest", bestScore);
    }

    document.getElementById("best").textContent = bestScore;

    document.getElementById("message").textContent =
        `Game Over! Final Score: ${score}`;
}

function catchKiwi(){

    if(!gameRunning) return;

    score++;
    document.getElementById("score").textContent = score;

    moveKiwi();
}

kiwi.addEventListener("click", catchKiwi);
kiwi.addEventListener("touchstart", catchKiwi);

moveKiwi();
</script>

</body>
</html>
