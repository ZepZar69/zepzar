<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Victors - The Gago List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === Premium Global Theme System === */
        :root {
            --bg-dark: #05070c;
            --accent-blue: #4bbdff;
            --accent-purple: #8b7cff;
            --accent-pink: #ff5ca8;
            --glass-bg: rgba(10, 14, 26, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #8e9bb0;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 40px 20px;
            font-family: "Lexend Deca", sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Layer 1: Drifting Deep Space Nebula */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 20% 25%, rgba(75, 189, 255, 0.22), transparent 35%),
                radial-gradient(circle at 80% 35%, rgba(255, 92, 168, 0.16), transparent 35%),
                radial-gradient(circle at 50% 80%, rgba(139, 124, 255, 0.22), transparent 40%);
            z-index: -2;
            animation: nebulaDrift 22s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* Layer 2: Moving Starfield Overlay */
        body::after {
            content: "";
            position: fixed;
            inset: -30%;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px);
            background-size: 80px 80px, 150px 150px;
            background-position: 0 0, 40px 40px;
            opacity: 0.65;
            z-index: -1;
            animation: starDrift 45s infinite linear;
            pointer-events: none;
        }

        @keyframes nebulaDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(2%, -4%) scale(1.06) rotate(2deg); }
            100% { transform: translate(-2%, 2%) scale(0.98) rotate(-1deg); }
        }

        @keyframes starDrift {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(150px) rotate(3deg); }
        }

        /* === Page Transition System === */
        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(15px);
            animation: pageFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-fade-out {
            animation: pageFadeOut 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        @keyframes pageFadeOut {
            to {
                opacity: 0;
                transform: translateY(-12px);
                filter: blur(4px);
            }
        }

        .container {
            width: min(800px, 100%);
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-sizing: border-box;
        }

        .back-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-smooth);
        }

        .back-link:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        /* === Hero Level Banner === */
        .level-hero {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            gap: 30px;
            align-items: center;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            transition: var(--transition-smooth);
        }

        .level-hero:hover {
            border-color: rgba(139, 124, 255, 0.35);
            box-shadow: 
                0 24px 50px rgba(0, 0, 0, 0.5), 
                0 0 35px rgba(139, 124, 255, 0.15);
        }

        .hero-thumb-wrapper {
            width: 200px;
            aspect-ratio: 16/9;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hero-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .level-hero:hover .hero-thumb {
            transform: scale(1.05);
        }

        .hero-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hero-info h1 {
            margin: 0;
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .hero-info .creator {
            color: var(--text-muted);
            font-size: 18px;
            margin: 0;
            font-weight: 400;
        }

        .hero-info .level-id {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        /* === Victors Title & List Section === */
        .victors-title {
            font-size: 20px;
            font-weight: 700;
            margin-top: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .victor-count-badge {
            background: rgba(75, 189, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(75, 189, 255, 0.25);
            padding: 5px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
        }

        .victors-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .victor-card {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition-smooth);
        }

        .victor-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(75, 189, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.25), 
                0 0 20px rgba(75, 189, 255, 0.08);
        }

        .victor-name {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .trophy-icon {
            font-size: 16px;
            background: rgba(255, 215, 0, 0.12);
            padding: 6px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .btn-proof {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            background: linear-gradient(135deg, #ff4757, var(--accent-pink));
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.25);
            transition: var(--transition-smooth);
        }

        .btn-proof:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.45);
            filter: brightness(1.1);
        }

        /* Empty & Loading status containers */
        .status-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            padding: 40px;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* LDM Control Button */
        .ldm-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(75, 189, 255, 0.35);
            transition: var(--transition-smooth);
        }

        .ldm-button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 35px rgba(75, 189, 255, 0.5);
        }

        /* LDM Optimized Mode overrides */
        .ldm * {
            animation: none !important;
            transition: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
        }

        .ldm::before, .ldm::after {
            display: none !important;
        }

        .ldm {
            background: #0a0c10 !important;
        }

        .ldm .level-hero {
            background: #141822 !important;
            border-color: #252e3d !important;
        }

        .ldm .victor-card {
            background: #141822 !important;
            border-color: #252e3d !important;
        }

        .ldm .btn-proof {
            background: #ff4757 !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }

            .level-hero {
                flex-direction: column;
                text-align: center;
                padding: 20px;
                gap: 20px;
            }

            .hero-thumb-wrapper {
                width: 100%;
            }

            .hero-info {
                align-items: center;
            }

            .victor-card {
                flex-direction: column;
                gap: 16px;
                text-align: center;
                padding: 20px;
            }

            .btn-proof {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <!-- Smooth Page Entry/Exit Wrapper -->
    <div class="page-wrapper">
        <div class="container">
            <a href="gagolist.html" class="back-link">← Back to List</a>

            <div id="hero-container">
                <div class="status-msg">Loading level details...</div>
            </div>

            <div class="victors-title">
                <span>List of Victors</span>
                <span id="victor-counter" class="victor-count-badge">0 Victors</span>
            </div>

            <div class="victors-list" id="victors-container">
                <div class="status-msg">Retrieving victors records...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABhdmEpVDR4jT1SSx85Y9Kglx9iiLPyaw",
            authDomain: "gago-list.firebaseapp.com",
            projectId: "gago-list",
            storageBucket: "gago-list.firebasestorage.app",
            messagingSenderId: "810290637749",
            appId: "1:810290637749:web:0e286faeee533032c247fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const levelIdParam = urlParams.get('id');

        if (!levelIdParam) {
            document.body.innerHTML = `
                <div style="text-align: center; padding-top: 100px; font-family: 'Lexend Deca';">
                    <h2>No Level ID Specified</h2>
                    <a href="gagolist.html" style="color: #4bbdff; text-decoration: none;">Return to Homepage</a>
                </div>
            `;
        } else {
            loadLevelAndVictors(levelIdParam);
        }

        async function loadLevelAndVictors(levelId) {
            const heroContainer = document.getElementById("hero-container");
            const victorsContainer = document.getElementById("victors-container");
            const counterBadge = document.getElementById("victor-counter");

            try {
                // --- STEP A: FETCH LEVEL BANNER ---
                const levelQuery = query(collection(db, "levels"), where("levelId", "==", levelId));
                const levelSnapshot = await getDocs(levelQuery);

                if (levelSnapshot.empty) {
                    heroContainer.innerHTML = `
                        <div class="status-msg" style="color: #ff4757; border-color: rgba(255, 71, 87, 0.3);">
                            Error: Level not found in database.
                        </div>
                    `;
                } else {
                    const levelData = levelSnapshot.docs[0].data();
                    heroContainer.innerHTML = `
                        <div class="level-hero">
                            <div class="hero-thumb-wrapper">
                                <img src="${levelData.thumbnailUrl}" alt="${levelData.name}" class="hero-thumb">
                            </div>
                            <div class="hero-info">
                                <h1>#${levelData.rank} - ${levelData.name}</h1>
                                <p class="creator">By ${levelData.creator}</p>
                                <div class="level-id">ID: ${levelData.levelId}</div>
                            </div>
                        </div>
                    `;
                    document.title = `${levelData.name} Victors - The Gago List`;
                }

                // --- STEP B: FETCH VICTORS ---
                const victorsQuery = query(
                    collection(db, "victors"), 
                    where("levelId", "==", levelId),
                    orderBy("createdAt", "asc")
                );
                const victorsSnapshot = await getDocs(victorsQuery);

                if (victorsSnapshot.empty) {
                    victorsContainer.innerHTML = `
                        <div class="status-msg">
                            No recorded victors yet. Be the first to submit proof!
                        </div>
                    `;
                    counterBadge.textContent = "0 Victors";
                } else {
                    victorsContainer.innerHTML = "";
                    counterBadge.textContent = `${victorsSnapshot.size} ${victorsSnapshot.size === 1 ? 'Victor' : 'Victors'}`;

                    victorsSnapshot.forEach((doc) => {
                        const victor = doc.data();
                        const victorCard = document.createElement("div");
                        victorCard.className = "victor-card";
                        victorCard.innerHTML = `
                            <div class="victor-name">
                                <span class="trophy-icon">🏆</span>
                                ${victor.playerName}
                            </div>
                            <a href="${victor.proofUrl}" target="_blank" class="btn-proof">Watch Proof</a>
                        `;
                        victorsContainer.appendChild(victorCard);
                    });
                }

            } catch (error) {
                console.error("Error loading victors sequence: ", error);
                victorsContainer.innerHTML = `
                    <div class="status-msg" style="color: #ff4757; border-color: rgba(255, 71, 87, 0.3);">
                        Error loading database records. Verify your Firestore Indexes.
                    </div>
                `;
            }
        }
    </script>

<script>
// Low Detail Mode controller
(() => {
    const key = "gagoLDM";
    if (localStorage.getItem(key) === "true") {
        document.body.classList.add("ldm");
    }

    const btn = document.createElement("button");
    btn.className = "ldm-button";
    btn.textContent = document.body.classList.contains("ldm") ? "⚡ LDM ON" : "✨ LDM OFF";

    btn.onclick = () => {
        document.body.classList.toggle("ldm");
        const enabled = document.body.classList.contains("ldm");
        localStorage.setItem(key, enabled);
        btn.textContent = enabled ? "⚡ LDM ON" : "✨ LDM OFF";
    };

    document.body.appendChild(btn);
})();

// Intercept clicks to perform custom out-transition fade animations
document.addEventListener("DOMContentLoaded", () => {
    const wrapper = document.querySelector(".page-wrapper");
    const links = document.querySelectorAll("a");

    links.forEach(link => {
        // Only intercept local links and avoid blank targets or external redirects
        if (
            link.hostname === window.location.hostname && 
            !link.target && 
            !link.href.includes("javascript:")
        ) {
            link.addEventListener("click", (e) => {
                e.preventDefault();
                const targetUrl = link.href;

                wrapper.classList.add("page-fade-out");

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 280); 
            });
        }
    });
});
</script>

</body>
</html>
