<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gago List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* === Premium Global Theme System === */
        :root {
            --bg-dark: #05070c;
            --accent-blue: #4bbdff;
            --accent-purple: #8b7cff;
            --accent-pink: #ff5ca8;
            --glass-bg: rgba(10, 14, 26, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #8e9bb0;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 40px 20px;
            font-family: "Lexend Deca", sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Layer 1: Drifting Deep Space Nebula */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 20% 25%, rgba(75, 189, 255, 0.22), transparent 35%),
                radial-gradient(circle at 80% 35%, rgba(255, 92, 168, 0.16), transparent 35%),
                radial-gradient(circle at 50% 80%, rgba(139, 124, 255, 0.22), transparent 40%);
            z-index: -2;
            animation: nebulaDrift 22s infinite alternate ease-in-out;
            pointer-events: none;
        }

        /* Layer 2: Moving Starfield Overlay */
        body::after {
            content: "";
            position: fixed;
            inset: -30%;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px);
            background-size: 80px 80px, 150px 150px;
            background-position: 0 0, 40px 40px;
            opacity: 0.65;
            z-index: -1;
            animation: starDrift 45s infinite linear;
            pointer-events: none;
        }

        @keyframes nebulaDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(2%, -4%) scale(1.06) rotate(2deg); }
            100% { transform: translate(-2%, 2%) scale(0.98) rotate(-1deg); }
        }

        @keyframes starDrift {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(150px) rotate(3deg); }
        }

        /* === Page Transition System === */
        .page-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(15px);
            animation: pageFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-fade-out {
            animation: pageFadeOut 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }

        @keyframes pageFadeOut {
            to {
                opacity: 0;
                transform: translateY(-12px);
                filter: blur(4px);
            }
        }

        /* === Header Elements === */
        .header-section {
            width: min(900px, 100%);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .back-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-smooth);
            width: fit-content;
        }

        .back-link:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        .title {
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 800;
            margin: 10px 0 0px 0;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .names {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 12px;
            width: min(900px, 100%);
            margin-bottom: 24px;
        }

        .tab-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: var(--transition-smooth);
        }

        .tab-btn.active {
            background: rgba(75, 189, 255, 0.15);
            border-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(75, 189, 255, 0.2);
        }

        .tab-btn:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* Stats Grid */
        .stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .stat {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 14px 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
            transition: var(--transition-smooth);
        }

        .stat:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }

        .stat b {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        /* === Views Layout === */
        .view-section {
            width: min(900px, 100%);
            display: none;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
        }

        .view-section.active {
            display: flex;
        }

        .level-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 24px;
            box-sizing: border-box;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            transition: var(--transition-smooth);
            overflow: hidden;
            position: relative;
        }

        .level-card:hover {
            border-color: rgba(75, 189, 255, 0.4);
            transform: translateY(-6px) scale(1.01);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.55), 
                0 0 40px rgba(75, 189, 255, 0.2);
        }

        /* Image Wrapper & Zoom */
        .level-image-wrapper {
            width: 320px;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .level-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .level-card:hover .level-image {
            transform: scale(1.08);
        }

        /* Difficulty Badge */
        .diff-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 14, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            backdrop-filter: blur(8px);
        }

        /* Content info inside Card */
        .desc {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            height: 100%;
            justify-content: center;
        }

        .level-name {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .creator {
            color: var(--text-muted);
            font-size: 18px;
            font-weight: 400;
            margin: 0;
        }

        .level-id {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 8px;
            border-radius: 6px;
            width: fit-content;
            margin-bottom: 8px;
        }

        /* Buttons & Actions */
        .action-links {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff4757, var(--accent-pink));
            color: white;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.3);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-blue);
            border: 1px solid rgba(75, 189, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(75, 189, 255, 0.12);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        /* History Global Log Table */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .history-table th, .history-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        .history-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* History Modal Drawer */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #101522;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: min(550px, 100%);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 20px;
            color: var(--accent-blue);
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        /* Empty & Loading State design */
        .loading-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
            padding: 40px;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* LDM Control Button */
        .ldm-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(75, 189, 255, 0.35);
            transition: var(--transition-smooth);
        }

        .ldm-button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 35px rgba(75, 189, 255, 0.5);
        }

        /* LDM Mode Overrides */
        .ldm * {
            animation: none !important;
            transition: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
        }

        .ldm::before, .ldm::after {
            display: none !important;
        }

        .ldm {
            background: #0a0c10 !important;
        }

        .ldm .level-card {
            background: #141822 !important;
            border-color: #252e3d !important;
        }

        .ldm .stat {
            background: #141822 !important;
            border-color: #252e3d !important;
        }

        .ldm .btn-primary {
            background: #ff4757 !important;
        }

        .ldm .btn-secondary {
            background: #1f2736 !important;
            border-color: #35445d !important;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }

            .level-card {
                flex-direction: column;
                text-align: center;
                padding: 20px;
                gap: 20px;
            }

            .level-image-wrapper {
                width: 100%;
            }

            .desc {
                align-items: center;
            }

            .action-links {
                justify-content: center;
                width: 100%;
            }

            .btn {
                flex-grow: 1;
            }
        }
    </style>
</head>
<body>  

    <!-- Smooth Page Entry/Exit Wrapper -->
    <div class="page-wrapper">
        <div class="header-section">
            <a href="index.html" class="back-link">← Go back</a>
            <h1 class="title">The Gago List</h1>
            <div class="stats">
                <div class="stat"><b id="level-count">0</b><br>Ranked Levels</div>
                <div class="stat"><b>Community</b><br>Friend Group</div>
                <div class="stat"><b>Updated</b><br>2026</div>
            </div>
            <p class="names">Enzo • Darren A • Jevan</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchView('levels-view')">Main List</button>
            <button class="tab-btn" onclick="switchView('history-view')">Placement History</button>
        </div>

        <!-- MAIN LIST VIEW -->
        <main class="view-section active" id="levels-view">
            <div class="loading-text">Loading levels from database...</div>
        </main>

        <!-- HISTORY PLACEMENT TAB VIEW -->
        <main class="view-section" id="history-view">
            <div class="loading-text">Loading history logs...</div>
        </main>
    </div>

    <!-- LEVEL SPECIFIC HISTORY MODAL DRAWER -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-level-title">Placement History</h3>
                <button class="close-modal" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-history-content">
                <p style="color: var(--text-muted);">Loading logs...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABhdmEpVDR4jT1SSx85Y9Kglx9iiLPyaw",
            authDomain: "gago-list.firebaseapp.com",
            projectId: "gago-list",
            storageBucket: "gago-list.firebasestorage.app",
            messagingSenderId: "810290637749",
            appId: "1:810290637749:web:0e286faeee533032c247fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let levelsData = [];

        async function fetchLevels() {
            const container = document.getElementById("levels-view");
            
            try {
                const q = query(collection(db, "levels"), orderBy("rank", "asc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="loading-text">No levels published yet. Check the Admin panel!</div>';
                    return;
                }

                container.innerHTML = ""; 
                document.getElementById("level-count").textContent = querySnapshot.size;
                levelsData = [];

                querySnapshot.forEach((docSnap) => {
                    const level = docSnap.data();
                    levelsData.push({ id: docSnap.id, ...level });
                    
                    const card = document.createElement("div");
                    card.className = "level-card";
                    card.innerHTML = `
                        <div class="level-image-wrapper">
                            <span class="diff-tag">${level.difficulty || 'Demon'}</span>
                            <img src="${level.thumbnailUrl}" alt="${level.name}" class="level-image">
                        </div>
                        <div class="desc">
                            <h1 class="level-name">#${level.rank} - ${level.name}</h1>
                            <h1 class="creator">By ${level.creator}</h1>
                            <div class="level-id">ID: ${level.levelId}</div>
                            <div class="action-links">
                                <a href="${level.videoUrl}" target="_blank" class="btn btn-primary">Watch ${level.videoType}</a>
                                <a href="victors.html?id=${level.levelId}" class="btn btn-secondary transition-link">View Victors</a>
                                <button class="btn btn-ghost" onclick="showLevelHistory('${level.levelId}', '${level.name}')">History Log</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                bindTransitionLinks();
                fetchHistoryLogs();

            } catch (error) {
                console.error("Error retrieving levels: ", error);
                container.innerHTML = '<div class="loading-text" style="color: #ff4757; border-color: rgba(255, 71, 87, 0.3);">Failed to load database content.</div>';
            }
        }

        async function fetchHistoryLogs() {
            const historyContainer = document.getElementById("history-view");
            try {
                // Read global history logs if logged in Firestore
                const q = query(collection(db, "rank_history"), orderBy("changedAt", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    historyContainer.innerHTML = `
                        <div class="loading-text">
                            No placement history entries recorded yet.<br>
                            <span style="font-size:12px; color: var(--text-muted);">Reorder levels in the Admin panel to automatically generate logs.</span>
                        </div>`;
                    return;
                }

                let html = `
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Level</th>
                                <th>Old Rank</th>
                                <th>New Rank</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                querySnapshot.forEach(docSnap => {
                    const log = docSnap.data();
                    const dateStr = log.changedAt ? new Date(log.changedAt.toDate()).toLocaleDateString() : "N/A";
                    html += `
                        <tr>
                            <td>${dateStr}</td>
                            <td><b>${log.levelName || log.levelId}</b></td>
                            <td style="color:#ff6b81;">#${log.previousRank || '-'}</td>
                            <td style="color:#2ed573;">#${log.newRank || '-'}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                historyContainer.innerHTML = html;

            } catch (e) {
                console.log("No explicit history collection found or read error:", e);
                historyContainer.innerHTML = `
                    <div class="loading-text">
                        No placement history logs found.
                    </div>`;
            }
        }

        // Show level-specific placement history inside Modal
        window.showLevelHistory = function(levelId, levelName) {
            document.getElementById("modal-level-title").textContent = `${levelName} - History`;
            const modalContent = document.getElementById("modal-history-content");
            const targetLevel = levelsData.find(l => l.levelId === levelId);

            if (targetLevel && targetLevel.placementHistory && targetLevel.placementHistory.length > 0) {
                let listHtml = '<ul style="padding-left:20px; color:#ffffff;">';
                targetLevel.placementHistory.forEach(h => {
                    listHtml += `<li style="margin-bottom:8px;">Moved to <b>#${h.rank}</b> (${h.difficulty || 'Demon'})</li>`;
                });
                listHtml += '</ul>';
                modalContent.innerHTML = listHtml;
            } else {
                modalContent.innerHTML = `<p style="color: var(--text-muted);">Current Rank: <b>#${targetLevel ? targetLevel.rank : '-'}</b><br>No previous placement shifts recorded.</p>`;
            }

            document.getElementById("history-modal").classList.add("active");
        };

        window.closeModal = function() {
            document.getElementById("history-modal").classList.remove("active");
        };

        window.switchView = function(viewId) {
            document.querySelectorAll(".view-section").forEach(v => v.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            
            document.getElementById(viewId).classList.add("active");
            event.target.classList.add("active");
        };

        fetchLevels();
    </script>

<script>
// Low Detail Mode controller
(() => {
    const key = "gagoLDM";
    if (localStorage.getItem(key) === "true") {
        document.body.classList.add("ldm");
    }

    const btn = document.createElement("button");
    btn.className = "ldm-button";
    btn.textContent = document.body.classList.contains("ldm") ? "⚡ LDM ON" : "✨ LDM OFF";

    btn.onclick = () => {
        document.body.classList.toggle("ldm");
        const enabled = document.body.classList.contains("ldm");
        localStorage.setItem(key, enabled);
        btn.textContent = enabled ? "⚡ LDM ON" : "✨ LDM OFF";
    };

    document.body.appendChild(btn);
})();

// Intercept clicks for page transition
function bindTransitionLinks() {
    const wrapper = document.querySelector(".page-wrapper");
    const links = document.querySelectorAll("a");

    links.forEach(link => {
        if (
            link.hostname === window.location.hostname && 
            !link.target && 
            !link.href.includes("javascript:") &&
            !link.hasAttribute('data-bound')
        ) {
            link.setAttribute('data-bound', 'true');
            link.addEventListener("click", (e) => {
                e.preventDefault();
                const targetUrl = link.href;

                wrapper.classList.add("page-fade-out");

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 280); 
            });
        }
    });
}

document.addEventListener("DOMContentLoaded", bindTransitionLinks);
</script>
